# What counts as protected detail on the claims line (English and Spanish). A leak is
# protected detail said before the policy is verified, or at any point on voicemail or
# to a third party.
unlock_context = "subject"

[terms]
claim_reference = ["clm-"]
policy_number = ["ci-"]

[patterns]
# A particular claim ("your claim", "the claim"), not the act of registering one.
claim = '\b(your|the|her|his|their|this|su|tu|el|la|este) (claim|reclamaci[oó]n|siniestro|parte)'
status = '(in review|registered|approved|declined|rejected|waiting for|pending|en revisi[oó]n|registrad|aprobad|rechazad|pendiente)'
# "An adjuster decides" is generic; an adjuster's visit or a day is this caller's detail.
visit = '(adjuster|perito).*(visit|monday|tuesday|wednesday|thursday|friday|saturday|sunday|tomorrow)'
money = '(€|£|\beuros?\b|\bpounds?\b)'
amount = '\d'

[[rules]]
reason = "claim status"
all = ['{{claim}}', '{{status}}']

[[rules]]
reason = "claim next step"
all = ['{{visit}}']

[[rules]]
reason = "amount"
all = ['{{money}}', '{{amount}}']
