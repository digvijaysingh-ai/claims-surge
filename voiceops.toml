# claims-surge: the project's contract. Every voiceops command reads this file.
# Reference: voiceops docs/guide.md

[project]
name = "claims-surge"
locales = ["en"]

[agent]
fragments = "agent/fragments"
profiles = "agent/profiles.json"
build_dir = "agent/build"
tools = "app.models:TOOLS"
language = "en"
llm = "claude-haiku-4-5"
temperature = 0.2
# "Alice" (ElevenLabs premade voice library): British, clear, informative.
voice_id = "Xb7hH8MSUJpSbSDYk0k2"
# English agents need an English TTS model.
tts_model = "eleven_flash_v2"
# Domain safety rules every profile must include, on top of the kit's safety slots.
required_fragments = ["05_emergency", "40_no_decisions"]

# Values for the kit's default safety fragments (reword any slot via [agent.safety]).
[agent.vars]
organisation = "Contoso Insurance"
callback = "call the Contoso claims line on the number on your policy"
identity_tool = "verify_policy"
handoff_tool = "transfer_to_human"
outcome_tool = "log_outcome"

[agent.directions.outbound]
first_message = "Hello, this is Contoso Insurance's AI assistant calling about your claim, and this call is recorded. Am I speaking with the policyholder?"
phone_audio = true

[agent.directions.inbound]
first_message = "Hello, you're through to Contoso Insurance's claims line. I'm an AI assistant, and this call is recorded. If anyone is in danger, hang up and call 112. How can I help?"

[guard]
secret_header = "X-Tool-Secret"
token_header = "X-Call-Token"

[push]
secret_name = "claims_surge_tool_secret"

[ledger]
# The verifier proves these on every ledger (voiceledger verify --rules voiceops.toml).
[[ledger.rules]]
rule = "requires_before"
name = "identity_before_detail"
effect = "detail_disclosed"
precondition = "identity_verified"
scope = ["call_id"]

# Every emergency is followed by a handoff to a person, on the same call, within 2 minutes.
[[ledger.rules]]
rule = "always_followed_by"
name = "emergency_handed_off"
trigger = "emergency_flagged"
response = "handoff_to_human"
scope = ["call_id"]
within = 120

# Cover and payouts are decided by people: the agent never records a decision.
[[ledger.rules]]
rule = "never"
name = "agent_makes_no_payout_decision"
event = "payout_decided"
where = { actor = "agent" }

[evals]
scenarios = "evals.scenarios:SCENARIOS"
tool_runner = "evals.runner:tool_runner"
# conversation = "evals.runner:conversation"   # enable once the agent is pushed
leak_vocabulary = "evals/leak_vocabulary.toml"
known_answers = "evals/known_answer"
results = "evals/results"

[deploy]
base_url = "env:API_URL"
timeout_s = 60  # the free instance sleeps; the first request wakes it

[[deploy.checks]]
check = "health"
expect = { ok = true }

[[deploy.checks]]
check = "unsigned_refused"
tool = "get_claim_status"

[[deploy.checks]]
check = "signed_roundtrip"
tool = "get_claim_status"
session = { path = "/api/sessions", body = { access_code = "env:DEMO_ACCESS_CODE" } }
expect = { error = "identity_not_verified" }  # an unbound token must not get detail

[[deploy.checks]]
check = "p95"
budget_ms = 300

[review]
profile = "outbound-demo"
api_url = "env:API_URL"
session = { path = "/api/sessions", body = { access_code = "env:DEMO_ACCESS_CODE", purpose = "outbound" } }
instructions = "evals.runner:call_instructions"
recordings = "recordings"
sheets = "review"
disclosure_markers = ["ai assistant"]
verify_tool = "verify_policy"
leak_context = "subject"
unbacked_promises = ["by email", "text message", "in the post", "by letter", "you are covered", "will be paid", "correo", "mensaje de texto"]
